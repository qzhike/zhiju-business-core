name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  select:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      target: ${{ steps.verification.outputs.target }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
      - name: Select verification target
        id: verification
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          PR_DRAFT: ${{ github.event.pull_request.draft || false }}
        run: >-
          node --experimental-strip-types tools/verification/select-target.mts
          "$BASE_SHA" "$GITHUB_SHA" "$GITHUB_EVENT_NAME" "$PR_DRAFT"

  checks:
    needs: select
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify documentation
        if: needs.select.outputs.target == 'docs'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: pnpm verify:docs
      - name: Install controlled Chromium
        if: needs.select.outputs.target == 'code' || needs.select.outputs.target == 'full'
        run: pnpm exec playwright install --with-deps chromium
      - name: Verify code
        if: needs.select.outputs.target == 'code' || needs.select.outputs.target == 'full'
        run: pnpm clean && pnpm verify:code

  persistence:
    needs: select
    if: needs.select.outputs.target == 'full'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The persistence gate now collects the built-browser acceptance suite
      # (#266), which launches the controlled Chromium against the real Core +
      # BFF + built SPA stack, so this runner needs the same pinned browser and
      # system dependencies that the checks job installs.
      - name: Install controlled Chromium
        run: pnpm exec playwright install --with-deps chromium
      # Independent runners need fresh workspace libraries for owning entries.
      # Static checks and ordinary tests execute only in the checks job.
      - name: Build persistence prerequisites
        run: pnpm clean && pnpm build
      - name: Verify persistence
        run: pnpm persistence:gate

  verify:
    needs: [select, checks, persistence]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        if: ${{ !cancelled() }}
      - uses: actions/setup-node@v4
        if: ${{ !cancelled() }}
        with:
          node-version: 24.19.0
      - name: Reject workflow cancellation
        if: ${{ cancelled() }}
        run: exit 1
      - name: Require all selected verification results
        if: ${{ always() && !cancelled() }}
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          WORKFLOW_CANCELLED: 'false'
        run: node --experimental-strip-types tools/verification/check-ci-results.mts
