name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: pnpm
      - name: Select verification target
        id: verification
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          PR_DRAFT: ${{ github.event.pull_request.draft || false }}
        run: >-
          node --experimental-strip-types tools/verification/select-target.mts
          "$BASE_SHA" "$GITHUB_SHA" "$GITHUB_EVENT_NAME" "$PR_DRAFT"
      - run: pnpm install --frozen-lockfile
      - name: Verify documentation
        if: steps.verification.outputs.target == 'docs'
        run: pnpm verify:docs
      - name: Verify code
        if: steps.verification.outputs.target == 'code'
        run: pnpm clean && pnpm verify:code
      - name: Verify full repository
        if: steps.verification.outputs.target == 'full'
        run: pnpm clean && pnpm verify
